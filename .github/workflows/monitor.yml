name: Run TL scanner

on:
  workflow_dispatch:
    inputs:
      post_mode:
        description: "投稿モード"
        required: false
        default: "normal"
        type: choice
        options:
          - normal
          - new
          - updated
      sample_one:
        description: "各ステージ1件に制限（書式確認用）"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tl-scanner
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/service_account.json
      GOOGLE_NEW_ARRIVALS_SPREADSHEET_ID: ${{ secrets.GOOGLE_NEW_ARRIVALS_SPREADSHEET_ID }}
      GOOGLE_DAMAGES_SPREADSHEET_ID: ${{ secrets.GOOGLE_DAMAGES_SPREADSHEET_ID }}
      CHARACTER_MASTER_SPREADSHEET_ID: ${{ secrets.CHARACTER_MASTER_SPREADSHEET_ID }}
      CHARACTER_MASTER_GID: ${{ secrets.CHARACTER_MASTER_GID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_CHANNEL_IDS: ${{ secrets.DISCORD_CHANNEL_IDS }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      PRICONNER_MONITOR_STAGES: youtube-channel,youtube-search,discord-channel
      PRICONNER_FORCE_NEW_POST: ${{ inputs.post_mode == 'new' && '1' || '' }}
      PRICONNER_FORCE_POST: ${{ inputs.post_mode == 'updated' && '1' || '' }}
      PRICONNER_FORCE_NEW_LIMIT_ONE: ${{ inputs.sample_one && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Write temporary credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DISCORD_CHANNELS_JSON_CONTENT: ${{ secrets.DISCORD_CHANNELS_JSON }}
        run: |
          python - <<'PY'
          import os
          raw = os.environ["GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT"]
          start = raw.find('"private_key": "')
          end = raw.find('",\n  "client_email"', start)
          if start >= 0 and end >= 0:
              prefix = raw[:start + len('"private_key": "')]
              key = raw[start + len('"private_key": "'):end]
              suffix = raw[end:]
              raw = prefix + key.replace('\r', '').replace('\n', '\\n') + suffix
          with open("service_account.json", "w", encoding="utf-8") as f:
              f.write(raw)
          PY
          printf '%s' "$DISCORD_CHANNELS_JSON_CONTENT" > discord_channels.json

      - name: Run monitor
        run: python monitor_runner.py

      - name: Remove temporary credentials
        if: always()
        run: rm -f service_account.json discord_channels.json
